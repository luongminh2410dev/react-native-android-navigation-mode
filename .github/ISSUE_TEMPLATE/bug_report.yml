name: Bug report
description: Wrong navigation mode, build failure, or crash
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: Expected result, actual result, and steps to reproduce.
    validations:
      required: true
  - type: input
    id: library-version
    attributes:
      label: Library version
      placeholder: 1.1.0
    validations:
      required: true
  - type: input
    id: react-native-version
    attributes:
      label: React Native version (and Expo SDK, if any)
      placeholder: 0.88.1 / Expo SDK 58
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - New Architecture
        - Legacy Architecture
        - Not sure
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device, OEM, and Android version
      placeholder: Samsung Galaxy S23, One UI 7, Android 15
    validations:
      required: true
  - type: dropdown
    id: system-setting
    attributes:
      label: Navigation style selected in system settings
      options:
        - Gesture navigation
        - 2-button
        - 3-button
        - OEM-specific gestures
    validations:
      required: true
  - type: textarea
    id: detection-result
    attributes:
      label: Output of getAndroidNavigationModeInfo()
      description: Include `mode`, `interactionMode`, and `source`.
      render: json
    validations:
      required: true
