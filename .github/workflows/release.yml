name: Release

# Publishes to npm when a version tag (vX.Y.Z or vX.Y.Z-pre) is pushed.
# Uses npm Trusted Publishing (OIDC): the package's npm settings trust this repository's release.yml, so no token is stored.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write # npm Trusted Publishing and provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Check the tag matches package.json and is on main
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tagged commit $GITHUB_SHA is not on main" >&2
            exit 1
          fi
      # Trusted Publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm test -- --runInBand
      - run: npm run lint
      - run: npm run typecheck
      - run: npm pack --dry-run --ignore-scripts
      - name: Publish
        run: |
          version="$(node -p "require('./package.json').version")"
          # Prerelease versions (with a hyphen) go to the `next` dist-tag so `latest` stays on stable releases.
          case "$version" in
            *-*) dist_tag=next ;;
            *) dist_tag=latest ;;
          esac
          npm publish --provenance --access public --tag "$dist_tag" --ignore-scripts
