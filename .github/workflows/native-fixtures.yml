name: Native fixtures

# Manual only: builds an example fixture against the packed library and runs the Kotlin detector tests.
on:
  workflow_dispatch:
    inputs:
      fixture:
        description: Fixture directory under example/
        required: true
        type: choice
        options: [rn-0.71, rn-0.76, rn-0.81, rn-0.82, rn-0.88]
      new_architecture:
        description: newArchEnabled (ignored by React Native 0.82+, which always uses the New Architecture)
        required: true
        type: boolean
        default: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
      - run: npm ci
      # Packs the library first: the fixture lockfile references the tarball, so `npm ci` cannot run before it exists.
      - name: Install fixture dependencies and the packed library
        run: example/scripts/install-library-into-fixtures.sh example/${{ inputs.fixture }}
      # Kotlin tests are not in the tarball, so they build the library from the repository sources.
      - name: Kotlin unit tests
        working-directory: example/${{ inputs.fixture }}/android
        run: ./gradlew --no-daemon -PuseLibrarySource=true :react-native-android-navigation-mode:testDebugUnitTest
      - name: Build against the packed library
        working-directory: example/${{ inputs.fixture }}/android
        run: ./gradlew --no-daemon -PnewArchEnabled=${{ inputs.new_architecture }} assembleRelease
