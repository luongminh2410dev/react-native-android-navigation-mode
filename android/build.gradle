import groovy.json.JsonSlurper

buildscript {
  ext.safeExtGet = { prop, fallback ->
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
  }

  // React Native < 0.73 app templates do not put the Kotlin Gradle plugin on the build classpath.
  def kotlinVersion = rootProject.ext.has('kotlinVersion') ? rootProject.ext.get('kotlinVersion') : '1.7.22'

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${kotlinVersion}"
  }
}

// Minor version of the host's react-native package, or null when it cannot be found.
def reactNativeMinorVersion() {
  def candidates = [
    new File(projectDir, "../../react-native/package.json"),
    new File(rootProject.projectDir, "../node_modules/react-native/package.json")
  ]
  def packageJson = candidates.find { it.exists() }
  if (packageJson == null) {
    return null
  }
  def parts = new JsonSlurper().parse(packageJson).version.tokenize(".")
  return parts[0].toInteger() > 0 ? Integer.MAX_VALUE : parts[1].toInteger()
}

// React Native 0.82+ always runs the New Architecture and ignores `newArchEnabled=false`.
def isNewArchitectureEnabled() {
  def minor = reactNativeMinorVersion()
  if (minor != null && minor >= 82) {
    return true
  }
  return rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
}

apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

if (isNewArchitectureEnabled()) {
  apply plugin: 'com.facebook.react'
}

android {
  namespace 'com.reactnativeandroidnavigationmode'
  compileSdkVersion safeExtGet('compileSdkVersion', 35)

  defaultConfig {
    minSdkVersion safeExtGet('minSdkVersion', 21)
    targetSdkVersion safeExtGet('targetSdkVersion', 35)
    buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString()
  }

  buildFeatures {
    buildConfig true
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = '17'
  }

  sourceSets {
    main {
      // The New Architecture spec extends the class generated by Codegen; the legacy spec is hand-written.
      java.srcDirs += [isNewArchitectureEnabled() ? "src/newarch/java" : "src/oldarch/java"]
    }
  }
}

repositories {
  google()
  mavenCentral()
}

dependencies {
  implementation "com.facebook.react:react-android"

  testImplementation "junit:junit:4.13.2"
}

if (isNewArchitectureEnabled()) {
  react {
    jsRootDir = file("../src/")
    libraryName = "RNAndroidNavigationModeSpec"
    codegenJavaPackageName = "com.reactnativeandroidnavigationmode"
  }
}
